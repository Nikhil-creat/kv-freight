server{listen 8080;root /usr/share/nginx/html;index index.html;server_tokens off;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://d2ol7oe51mr4n9.cloudfront.net; media-src https://d2ol7oe51mr4n9.cloudfront.net; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;add_header X-Frame-Options DENY always;add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;add_header Strict-Transport-Security "max-age=63072000" always;
location / {try_files $uri $uri/ =404;}}
